# ==============================================================================
# GSD-BAK Configuration
# ==============================================================================
# Deployment, backup, and log management settings for GSD infrastructure.
# Used by: setup-log-rotation.sh, install-gsd-service.sh, backup scripts
# ==============================================================================

# ------------------------------------------------------------------------------
# Path Configuration
# ------------------------------------------------------------------------------
paths:
  # GSD production directory
  gsd_dir: /opt/geodineum/GSD

  # GSD-BAK directory (this config's parent)
  gsd_bak_dir: /opt/geodineum/GSD-BAK

  # Log archive directory (gitignored, created on install)
  log_archive_dir: /opt/geodineum/GSD-BAK/logs

  # ValKey backup directory
  valkey_backup_dir: /opt/geodineum/GSD-BAK/backups/valkey

# ------------------------------------------------------------------------------
# Log Rotation Settings
# ------------------------------------------------------------------------------
log_rotation:
  # Rotation frequency: daily, weekly, monthly
  frequency: daily

  # Number of rotated logs to keep
  retain_count: 7

  # Compress rotated logs
  compress: true

  # Delay compression by one rotation cycle
  delay_compress: true

# ------------------------------------------------------------------------------
# Log Truncation Settings
# ------------------------------------------------------------------------------
log_truncation:
  # Truncation threshold in bytes (10MB = 10485760)
  threshold_bytes: 10485760

  # Human-readable threshold (for display)
  threshold_human: 10MB

  # Backup logs before truncating
  backup_before_truncate: true

  # Maximum age of archived logs in days (0 = keep forever)
  archive_retention_days: 30

# ------------------------------------------------------------------------------
# Log Sources
# ------------------------------------------------------------------------------
log_sources:
  # gCore bootstrap logs
  gcore:
    enabled: true
    path: /var/log/gcore/*.log
    owner: www-data
    group: www-data
    mode: "0640"

  # WordPress plugin logs (all sites)
  wordpress:
    enabled: true
    path: /var/www/*/wp-content/logs/*.log
    owner: www-data
    group: www-data
    mode: "0640"
    # Only truncate info logs (not warning/error)
    truncate_pattern: "*-info.log"
    truncate_threshold_bytes: 5242880  # 5MB for WP logs

# ------------------------------------------------------------------------------
# ValKey Backup Settings
# ------------------------------------------------------------------------------
valkey_backup:
  # Number of backups to retain
  retain_count: 30

  # Backup schedule (via systemd timer)
  schedule: "02:00"

  # Verify backup integrity after creation
  verify_integrity: true
